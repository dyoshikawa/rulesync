version: 2
updates:
  # Automatic updates for npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 1
    open-pull-requests-limit: 2
    groups:
      # Minor and patch bumps travel together so a routine week is one PR.
      all-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Semver-major bumps get their own PR so they are never buried inside a
      # 100-package batch and can be reviewed, reverted, or bisected alone.
      # (0.x packages still classify 0.23 -> 0.24 as minor and stay above.)
      major-dependencies:
        patterns:
          - "*"
        update-types:
          - "major"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
    assignees:
      - "dyoshikawa"
      - "cm-dyoshikawa"
    allow:
      - dependency-type: "all"

  # Automatic updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 1
    open-pull-requests-limit: 1
    groups:
      all-actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: "actions/checkout"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "ci"
      - "automated"
    assignees:
      - "dyoshikawa"
      - "cm-dyoshikawa"

  # Automatic updates for Docker
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 1
    open-pull-requests-limit: 1
    groups:
      all-docker:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
    assignees:
      - "dyoshikawa"
      - "cm-dyoshikawa"
