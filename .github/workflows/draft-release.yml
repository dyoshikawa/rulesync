name: Draft Release

on:
  workflow_dispatch:
    inputs:
      new_version:
        description: "New version without v prefix (e.g. 1.0.0). If empty, determined automatically by semantic versioning rules."
        required: false
        type: string
        default: ""
      model:
        description: "Model abbreviation (codex, glm, kimi). If empty, defaults to glm."
        required: false
        type: string
        default: ""

jobs:
  draft-release:
    if: >-
      github.actor == 'dyoshikawa' ||
      github.actor == 'cm-dyoshikawa'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Start cicd-sensor
        uses: ./.github/actions/cicd-sensor
        with:
          bot-id: ${{ vars.SHISHO_BOT_ID }}

      - name: Configure git
        uses: ./.github/actions/git-config

      - name: Setup mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          experimental: true

      - name: Setup Takumi Guard npm registry
        uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1.4.0

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Generate rules
        run: pnpm generate

      - name: Select model
        id: select-model
        uses: ./.github/actions/select-opencode-model
        with:
          input-text: ${{ inputs.model }}

      - name: Run OpenCode to draft release
        # github-v1.2.28 is kept because it is the last versioned github-v* tag
        # and it SHA-pins its transitive actions/cache (v4.3.0). Later 1.x and
        # early 2.x tags still ship github/action.yml but use the mutable
        # actions/cache@v4, and upstream later removed the action
        # (anomalyco/opencode#59032).
        # Dependabot is told to leave this pin alone.
        uses: anomalyco/opencode/github@17b79f4e0c16dcff200b0417567ed22aeb2d7166 # github-v1.2.28
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_NEW_VERSION: ${{ inputs.new_version }}
        with:
          model: ${{ steps.select-model.outputs.model }}
          use_github_token: "true"
          share: false
          prompt: |
            Run the `draft-release` skill. Use the value of the `$INPUT_NEW_VERSION` environment variable as the skill's argument (it may be empty, in which case the skill will determine the new version automatically).
