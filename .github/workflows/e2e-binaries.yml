name: E2E Tests on Cross-Platform

on:
  push:
    branches: [main]
    paths-ignore: &paths-ignore
      - "**/*.md"
      - "images/**"
      - ".devcontainer/**"
      - ".vscode/**"
      - ".zed/**"
      - "LICENSE"
      - "cspell.json"
      - ".cspellcache"
      - ".secretlintrc.json"
  pull_request:
    branches: [main]
    paths-ignore: *paths-ignore

permissions:
  contents: read # Required for checking out code

jobs:
  e2e:
    name: E2E Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Keep every platform leg running even if one fails, so a single
      # platform-specific breakage does not mask the others' results.
      fail-fast: false
      matrix:
        # Bun's AOT compiler only targets the platform it runs on, so each
        # binary is built and tested on a native runner of its own.
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: darwin-arm64
            os: macos-latest
          - target: darwin-x64
            os: macos-15-intel
          - target: windows-x64
            os: windows-latest
            ext: .exe

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          experimental: true

      - name: Setup Takumi Guard npm registry
        uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1.4.0

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Build binary
        uses: ./.github/actions/build-bun-binary
        with:
          outfile: dist-bun/rulesync-${{ matrix.target }}${{ matrix.ext }}

      - name: Test binary
        env:
          RULESYNC_CMD: dist-bun/rulesync-${{ matrix.target }}${{ matrix.ext }}
        run: pnpm test:e2e
