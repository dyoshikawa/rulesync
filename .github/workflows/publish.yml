name: Publish

on:
  workflow_run:
    workflows: ["Publish Assets"]
    types: [completed]

permissions:
  id-token: write # Required for OIDC
  contents: write # Required for checking out code and editing release state

jobs:
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    # Bind the trigger to this repository's own Publish Assets workflow file:
    # a fork PR could otherwise add a workflow named "Publish Assets" on a
    # `release/v*` branch, or open such a branch from a fork, and complete a
    # run that reaches this job.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/publish-assets.yml' &&
      startsWith(github.event.workflow_run.head_branch, 'release/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: main

      - name: Start cicd-sensor
        uses: ./.github/actions/cicd-sensor
        with:
          bot-id: ${{ vars.SHISHO_BOT_ID }}

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          experimental: true

      - name: Setup Takumi Guard npm registry
        uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1.4.0

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Publish to npm
        # Keep the environment override and CLI flag together so publishing
        # cannot fall back to the installation proxy if either is refactored.
        env:
          PNPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: pnpm publish --registry="$PNPM_CONFIG_REGISTRY"

      - name: Publish target draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          TAG="${HEAD_BRANCH#release/}"
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid release tag derived from branch: $HEAD_BRANCH"
            exit 1
          fi
          gh release edit "$TAG" --draft=false --latest

  # The Homebrew tap formula (Formula/rulesync.rb) is no longer updated by a
  # dedicated CI job here. The `goal-release` skill regenerates it from the
  # release's SHA256SUMS after the release PR merges and the Publish Assets
  # workflow uploads the binaries (scripts/generate-homebrew-formula.ts).
