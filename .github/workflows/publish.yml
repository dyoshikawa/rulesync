name: Publish

on:
  workflow_run:
    workflows: ["Publish Assets"]
    types: [completed]

permissions:
  id-token: write # Required for OIDC
  contents: write # Required for checking out code and editing release state

jobs:
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    # Bind the trigger to this repository's own Publish Assets run. The
    # `head_repository` check is what blocks forks: a fork PR could otherwise
    # add a workflow named "Publish Assets", or edit publish-assets.yml in
    # place on a `release/v*` branch, and complete a run that reaches this job.
    # The `path` check is a secondary guard against another same-repo workflow
    # named "Publish Assets"; a fork editing publish-assets.yml keeps the same
    # `path`. A same-repo PR closed without merging is stopped by the "Verify
    # the release PR was merged" step below.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/publish-assets.yml' &&
      startsWith(github.event.workflow_run.head_branch, 'release/v')

    steps:
      # `Publish Assets` runs on `pull_request: closed` with the PR's own
      # workflow definition, so its `merged` check can be rewritten by anyone
      # who can push a `release/v*` branch and then close the PR unmerged.
      # Require the triggering commit to be reachable from `main` before
      # anything else runs. Release PRs are merged with a merge commit (the
      # `goal-release` skill uses `gh pr merge --merge`); a squash or rebase
      # merge rewrites the commit, so this step fails closed and the release
      # has to be published by hand.
      - name: Verify the release PR was merged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if ! echo "$HEAD_SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::Invalid head SHA: $HEAD_SHA"
            exit 1
          fi
          STATUS="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${HEAD_SHA}" --jq '.status')"
          if [ "$STATUS" != "behind" ] && [ "$STATUS" != "identical" ]; then
            echo "::error::$HEAD_SHA is not on main (compare status: $STATUS); the release PR was not merged"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: main

      - name: Start cicd-sensor
        uses: ./.github/actions/cicd-sensor
        with:
          bot-id: ${{ vars.SHISHO_BOT_ID }}

      - name: Setup mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          experimental: true

      - name: Setup Takumi Guard npm registry
        uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1.4.0

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Publish to npm
        # Keep the environment override and CLI flag together so publishing
        # cannot fall back to the installation proxy if either is refactored.
        env:
          PNPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: pnpm publish --registry="$PNPM_CONFIG_REGISTRY"

      - name: Publish target draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          TAG="${HEAD_BRANCH#release/}"
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid release tag derived from branch: $HEAD_BRANCH"
            exit 1
          fi
          gh release edit "$TAG" --draft=false --latest

  # The Homebrew tap formula (Formula/rulesync.rb) is no longer updated by a
  # dedicated CI job here. The `goal-release` skill regenerates it from the
  # release's SHA256SUMS after the release PR merges and the Publish Assets
  # workflow uploads the binaries (scripts/generate-homebrew-formula.ts).
