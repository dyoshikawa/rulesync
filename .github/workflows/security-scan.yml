name: Security Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read
  id-token: write

jobs:
  security-scan:
    name: Security Scan with OpenRouter
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Start cicd-sensor
        uses: ./.github/actions/cicd-sensor
        with:
          bot-id: ${{ vars.SHISHO_BOT_ID }}

      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          experimental: true

      - name: Setup Takumi Guard npm registry
        uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1.4.0

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Generate repomix XML files
        run: pnpm exec tsx scripts/generate-repomix-xml.ts

      - name: Run security scan
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SECURITY_SCAN_MODEL: ${{ secrets.SECURITY_SCAN_MODEL }}
          SECURITY_SCAN_PROMPT: ${{ secrets.SECURITY_SCAN_PROMPT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          SECURITY_SCAN_RECIPIENT: ${{ secrets.SECURITY_SCAN_RECIPIENT }}
        run: pnpm exec tsx scripts/security-scan-xml.ts
