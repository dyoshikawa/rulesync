name: Security Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  security-scan:
    name: Security Scan with OpenRouter
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true

      - name: Setup Takumi Guard npm registry
        uses: flatt-security/setup-takumi-guard-npm@6d4182745c1e474c35a023573c2612c085be45a4 # v1

      - name: Install dependencies
        run: pnpm install

      - name: Generate repomix XML files
        run: pnpm exec tsx scripts/generate-repomix-xml.ts

      - name: Run security scan
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SECURITY_SCAN_MODEL: ${{ secrets.SECURITY_SCAN_MODEL }}
          SECURITY_SCAN_PROMPT: ${{ secrets.SECURITY_SCAN_PROMPT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          SECURITY_SCAN_RECIPIENT: ${{ secrets.SECURITY_SCAN_RECIPIENT }}
        run: pnpm exec tsx scripts/security-scan-xml.ts
